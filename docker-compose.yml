services:
  bot:
    container_name: bot
    image: ${REGISTRY_URL}/${GITHUB_REPOSITORY}:${TAG:-main}
    depends_on:
      redis:
        condition: service_started
      export-html:
        condition: service_started
      database:
        condition: service_healthy
    volumes:
      - ./logs:/opt/logs
      - ./config:/opt/config
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.monitor-only=false"

  export-html:
    container_name: export-html
    image: bedrockio/export-html:latest
    expose:
      - "2305"
    restart: always

  database:
    container_name: database
    image: postgres:16.2-alpine3.19
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    command: -p ${POSTGRES_PORT}
    expose:
      - ${POSTGRES_PORT}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p ${POSTGRES_PORT}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - database:/var/lib/postgresql/data
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  redis:
    container_name: redis
    image: 'redis:latest'
    command: redis-server --requirepass ${REDIS_PASSWORD} --port ${REDIS_PORT}
    expose:
      - ${REDIS_PORT}
    volumes:
      - redis-data:/data
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=false"


  watchtower:
    image: containrrr/watchtower
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    command: -i 60
    volumes:
      - /home/ubuntu/.docker:/config
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  redis-data:
  database: